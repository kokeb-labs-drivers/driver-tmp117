<text x="46" y="623.3" font-size="17" font-weight="700" fill="#334155">Limits</text>
<text x="46" y="643.8" font-size="15" fill="#334155">Four addresses, 0x48 to 0x4B, chosen by the ADD0 pin (7.5.3.1.2, p. 21).</text>

<text x="52" y="251.3" font-size="17" font-weight="700" fill="#1E429F">MCU</text>
<text x="52" y="279.1" font-size="15" fill="#2B3442">I2C controller</text>
<text x="52" y="343.3" font-size="17" font-weight="700" fill="#0B5F59">TMP117</text>
<text x="52" y="371.1" font-size="15" fill="#2B3442">0x48, ADD0 to GND</text>
<text x="52" y="435.3" font-size="17" font-weight="700" fill="#0E1726">…</text>
<text x="52" y="463.1" font-size="15" fill="#2B3442">ADD0 to V+ or SDA</text>
<text x="52" y="527.3" font-size="17" font-weight="700" fill="#0B5F59">TMP117</text>
<text x="52" y="555.1" font-size="15" fill="#2B3442">0x4B, ADD0 to SCL</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">TMP117</title>
<desc id="chip-hero-desc">Overview of the TMP117, a digital temperature sensor with a 16-bit result in steps of 1/128 °C, accurate to 0.1 °C from -20 °C to 50 °C, a programmable alert window and a small EEPROM, read over I2C or SMBus. A MCU talks to it over I2C; it drives ALERT line; it reads back Die temperature. Headline figures: ±0.1 °C maximum error, -20 to 50 °C; 1/128 °C per count, 16-bit result; 1.8 to 5.5 V supply, 1.7 V up to 70 °C; 3.5 µA typical at one result per second; 400 kHz fastest SCL; 0.15 µA typical in shutdown.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" role="img" aria-labelledby="chip-frame-i2c-title chip-frame-i2c-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-i2c-title">TMP117: I2C register word</title>
<desc id="chip-frame-i2c-desc">I2C register word of the TMP117, 24 bits, most significant bit first. Write: 0000 (bits 23 to 20), pointer (bits 19 to 16), data high (bits 15 to 8), data low (bits 7 to 0); Read: 0000 (bits 23 to 20), pointer (bits 19 to 16), reply high (bits 15 to 8), reply low (bits 7 to 0).</desc>
<rect x="0.5" y="0.5" width="1199" height="415" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">TMP117: I2C register word</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">One register per transfer; the pointer byte comes first and the word follows, high byte first. 24 bits, sent most significant bit</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">first. Datasheet: 7.5.3.1.3 Writing and Reading Operation, p. 21.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
<rect x="429" y="209.5" width="118.5" height="46" rx="6" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="547.5" y="209.5" width="118.5" height="46" rx="6" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="666" y="209.5" width="237" height="46" rx="6" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="903" y="209.5" width="237" height="46" rx="6" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="429" y="297.5" width="118.5" height="46" rx="6" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="547.5" y="297.5" width="118.5" height="46" rx="6" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="666" y="297.5" width="237" height="46" rx="6" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<rect x="903" y="297.5" width="237" height="46" rx="6" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="429" y="191.5" font-size="16" fill="#9AA6B5">MSB, sent first</text>
<text x="1140" y="191.5" font-size="16" text-anchor="end" fill="#9AA6B5">LSB, sent last</text>
<text x="32" y="230.5" font-size="20" font-weight="700" fill="#E8EDF3">Write</text>
<text x="32" y="250.5" font-size="16" fill="#9AA6B5">host to chip, address + W first</text>
<text x="488.2" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#E2E8F0">0000</text>
<text x="431" y="275.5" font-size="16" fill="#9AA6B5">23</text>
<text x="545.5" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">20</text>
<text x="606.8" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BFDBFE">pointer</text>
<text x="549.5" y="275.5" font-size="16" fill="#9AA6B5">19</text>
<text x="664" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">16</text>
<text x="784.5" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BBF7D0">data high</text>
<text x="668" y="275.5" font-size="16" fill="#9AA6B5">15</text>
<text x="901" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">8</text>
<text x="1021.5" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BBF7D0">data low</text>
<text x="905" y="275.5" font-size="16" fill="#9AA6B5">7</text>
<text x="1138" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">0</text>
<text x="32" y="318.5" font-size="20" font-weight="700" fill="#E8EDF3">Read</text>
<text x="32" y="338.5" font-size="16" fill="#9AA6B5">pointer, then repeated START, address + R</text>
<text x="488.2" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#E2E8F0">0000</text>
<text x="431" y="363.5" font-size="16" fill="#9AA6B5">23</text>
<text x="545.5" y="363.5" font-size="16" text-anchor="end" fill="#9AA6B5">20</text>
<text x="606.8" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BFDBFE">pointer</text>
<text x="549.5" y="363.5" font-size="16" fill="#9AA6B5">19</text>
<text x="664" y="363.5" font-size="16" text-anchor="end" fill="#9AA6B5">16</text>
<text x="784.5" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#FDE68A">reply high</text>
<text x="668" y="363.5" font-size="16" fill="#9AA6B5">15</text>
<text x="901" y="363.5" font-size="16" text-anchor="end" fill="#9AA6B5">8</text>
<text x="1021.5" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#FDE68A">reply low</text>
<text x="905" y="363.5" font-size="16" fill="#9AA6B5">7</text>
<text x="1138" y="363.5" font-size="16" text-anchor="end" fill="#9AA6B5">0</text>
</svg>

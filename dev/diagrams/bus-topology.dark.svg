<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="bus-topology-title bus-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="bus-topology-title">Up to four TMP117 on one I2C bus</title>
<desc id="bus-topology-desc">An I2C bus on which an MCU and up to four TMP117 devices share SDA and SCL, each at the address its ADD0 pin selects, with one pull-up resistor per line.</desc>
<rect x="0.5" y="0.5" width="639" height="689" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Up to four TMP117 on one I2C bus</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: 7.5.3.1.2 Serial Bus Address, p. 21.</text>
<rect x="32" y="118.7" width="576" height="1" fill="#252F3C"/>

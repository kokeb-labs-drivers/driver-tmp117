<text x="507" y="158.9" font-size="14" font-weight="600" text-anchor="end" fill="#FDE68A">pull-ups to V+</text>
<text x="46" y="623.3" font-size="17" font-weight="700" fill="#E2E8F0">Limits</text>
<text x="46" y="643.8" font-size="15" fill="#E2E8F0">Four addresses, 0x48 to 0x4B, chosen by the ADD0 pin (7.5.3.1.2, p. 21).</text>

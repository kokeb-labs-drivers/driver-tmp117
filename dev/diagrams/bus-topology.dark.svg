<text x="52" y="251.3" font-size="17" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="52" y="279.1" font-size="15" fill="#D2DAE4">I2C controller</text>
<text x="52" y="343.3" font-size="17" font-weight="700" fill="#A7F3E6">TMP117</text>
<text x="52" y="371.1" font-size="15" fill="#D2DAE4">0x48, ADD0 to GND</text>
<text x="52" y="435.3" font-size="17" font-weight="700" fill="#E8EDF3">…</text>
<text x="52" y="463.1" font-size="15" fill="#D2DAE4">ADD0 to V+ or SDA</text>
<text x="52" y="527.3" font-size="17" font-weight="700" fill="#A7F3E6">TMP117</text>
<text x="52" y="555.1" font-size="15" fill="#D2DAE4">0x4B, ADD0 to SCL</text>
<text x="542.7" y="144.9" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">SDA</text>

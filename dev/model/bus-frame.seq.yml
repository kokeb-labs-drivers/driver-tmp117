# Model of the figure 'bus-frame'. Edit this file; `kokeb-docs figures` draws it. Never edit the SVGs.
kind: seq
id: bus-frame
title: One register read on the I2C bus
alt: >-
  Sequence of one I2C register read: the host sends START, the write address and the pointer 00h of Temp_Result,
  repeats START with the read address, the TMP117 returns two bytes and the host ends with NACK and STOP.
reads: >-
  Two participants, the host and the TMP117. The host sends START, address 0x48 with the write bit and the pointer
  byte 0x00, Temp_Result. It repeats START with address 0x48 and the read bit. The chip returns the high byte and the
  low byte of the register. The host answers the last byte with NACK and ends the transaction with STOP.
print: landscape
sources:
  - docs/model/bus-frame.seq.yml
participants:
  - {id: host, label: Host, tone: magenta}
  - {id: chip, label: TMP117, tone: green}
steps:
  - {from: host, to: chip, label: "START, 0x48 + W, 0x00 (Temp_Result)"}
  - {from: host, to: chip, label: "repeated START, 0x48 + R"}
  - {from: chip, to: host, label: "high byte, low byte", return: true}
  - {from: host, to: chip, label: "NACK, STOP"}

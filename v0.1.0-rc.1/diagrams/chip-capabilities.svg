<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1032" viewBox="0 0 1200 1032" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the TMP117 does</title>
<desc id="chip-capabilities-desc">Capability map of the TMP117: Temperature (supported): A 16-bit result, 7.8125 m°C per count, never the 8000h value before a conversion; Averaging and cycle time (supported): 1, 8, 32 or 64 conversions per result and eight cycle times, checked against Table 7-7; Continuous, shutdown, one-shot (supported): Converts continuously, sleeps at 0.15 µA, or takes one result on request; Alert window and therm (supported): ALERT outside a window (alert mode) or above a limit with hysteresis (therm mode), flags latched; Offset trim (supported): The chip adds a signed offset to every result, up to ±256 °C in 7.8125 m°C steps; Power-on defaults (guarded): Stores the configuration, limits and offset so the chip starts alone; every step checked and relocked; Identity and traceability (supported): Checks Device_ID before anything else and reads the two NIST traceability words; Soft and general-call reset (guarded): Soft reset by default; the bus-wide general-call reset only when you opt in; SMBus alert response (not covered): The bus-wide alert address read; the driver returns Unsupported and says why.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="952" height="554" viewBox="0 0 952 554" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">TMP117: Typical connections</title>
<desc id="chip-circuit-typical-desc">Schematic of the TMP117 typical connections: the chip with U2 MCU, C1 capacitor 0.1 µF, R1 resistor 5 kΩ, R2 resistor 5 kΩ; the MCU wires carry the port hooks ReadAlertPin(bool&amp;), Write() / WriteRead().</desc>
<rect x="0.5" y="0.5" width="951" height="553" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">TMP117: Typical connections</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The TMP117 on an MCU's I2C bus at address 0x48, with 5 kΩ pull-ups on SDA and ALERT and the 0.1 µF bypass</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">capacitor, as in the datasheet's typical application. ALERT goes to an interrupt input. Above each MCU wire: the port</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">hook that drives it. Datasheet: 8.2 Typical Application, p. 33.</text>
<rect x="32" y="163.3" width="888" height="1" fill="#252F3C"/>

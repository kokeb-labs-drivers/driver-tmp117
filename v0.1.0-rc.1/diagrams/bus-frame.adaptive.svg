<svg xmlns="http://www.w3.org/2000/svg" width="477" height="343" viewBox="0 0 477 343" role="img" aria-labelledby="bus-frame-title bus-frame-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="bus-frame-title">One register read on the I2C bus</title>
<desc id="bus-frame-desc">Sequence of one I2C register read: the host sends START, the write address and the pointer 00h of Temp_Result, repeats START with the read address, the TMP117 returns two bytes and the host ends with NACK and STOP.</desc>

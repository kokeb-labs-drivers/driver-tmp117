<text x="50" y="598.8" font-size="17" fill="#FECDD3">+3V3: V+; also U2.VDD · GND: ADD0, GND; also U2.GND</text>
<text x="50" y="668.3" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="691.8" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor, 2 resistors around the supplies (values in the full schematic). Not wired in this circuit (1): Thermal pad.</text>
